name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Емулятор Realtime Database для scripts/selfcheck-db-rules.js
      - name: Cache Firebase emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-db-emulator-v1

      - name: Install Firebase database emulator
        run: npx --yes firebase-tools@13 setup:emulators:database

      - name: Syntax check
        run: npm run -s lint

      - name: Self-checks (unit + API + database rules)
        run: npm test

      - name: Fail if the emulator was skipped
        run: node scripts/selfcheck-db-rules.js | tee /tmp/rules.log && ! grep -q '^SKIP' /tmp/rules.log

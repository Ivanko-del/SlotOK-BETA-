       бірюзовим відбитком на чорнильному тлі. PNG-іконки рендерить
       scripts/render-icons.js (шрифт Unbounded береться з Google Fonts). -->
  <rect width="512" height="512" rx="104" fill="#0E1020"/>
  <g transform="rotate(-5 256 256)">
    <rect x="132" y="132" width="272" height="272" rx="56" fill="#3CCFBD"/>
    <rect x="108" y="108" width="272" height="272" rx="56" fill="#FF7A3D" stroke="#05060E" stroke-width="10"/>
    <text x="244" y="250" text-anchor="middle" dominant-baseline="central" font-family="Unbounded, sans-serif" font-weight="800" font-size="200" fill="#1A0E08">S</text>
  </g>
